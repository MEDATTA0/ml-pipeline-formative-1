[project]
name = "formative-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ibrahim Maâzou Djahadi", email = "ibrahimdjahadi46@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "fastapi[standard]>=0.162.0",
    "joblib>=1.6.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "pymongo>=4.19.0",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
]

[project.scripts]
formative-1 = "formative_1:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
